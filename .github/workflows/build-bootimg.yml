name: Build C7 Debian (Full)

on:
  workflow_dispatch:
    inputs:
      rootfs_uuid:
        description: 'rootfs.img UUID (blkid rootfs.img). Leave empty for placeholder.'
        required: false
        default: ''

env:
  KERNEL_REPO: https://github.com/msm8953-mainline/linux
  KERNEL_BRANCH: 6.16.3/main
  MIRROR: https://mirrors.tuna.tsinghua.edu.cn/debian/

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu device-tree-compiler \
            bison flex libssl-dev libdw-dev libelf-dev dpkg-dev \
            build-essential debhelper \
            fakeroot bc kmod cpio \
            debootstrap qemu-user-static binfmt-support \
            android-sdk-libsparse-utils \
            zstd xz-utils rsync
          sudo apt-get install -y python3 python3-mako
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true
          sudo systemctl restart binfmt-support 2>/dev/null || true

      - name: Clone kernel
        run: |
          git clone --depth 1 -b "${{ env.KERNEL_BRANCH }}" \
            ${{ env.KERNEL_REPO }} linux

      - name: Build kernel (Image + dtb + deb)
        run: |
          cp device-dts/qcom/msm8953-samsung-c7lte.dts linux/arch/arm64/boot/dts/qcom/
          if ! grep -q "msm8953-samsung-c7lte" linux/arch/arm64/boot/dts/qcom/Makefile; then
            sed -i '/msm8953-motorola-potter.dtb/a\dtb-$(CONFIG_ARCH_QCOM)\t+= msm8953-samsung-c7lte.dtb' \
              linux/arch/arm64/boot/dts/qcom/Makefile
          fi
          sed 's/CONFIG_LOCALVERSION=".*"/CONFIG_LOCALVERSION="-c7-mainline"/' \
            config/msm8953-mainline.config > linux/.config
          cd linux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            qcom/msm8953-samsung-c7lte.dtb
          mkdir -p ../out
          cp arch/arm64/boot/Image ../out/
          cp arch/arm64/boot/dts/qcom/msm8953-samsung-c7lte.dtb ../out/
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            DEB_BUILD_PROFILES=pkg.linux-upstream.nokernelheaders \
            bindeb-pkg -j$(nproc)
          cp -f ../linux-image-*.deb ../out/ 2>/dev/null || true
          ls -lh ../out/

      - name: Build rootfs (Debian bookworm arm64)
        run: |
          set -e
          dd if=/dev/zero of=rootfs.img bs=1M count=4096
          mkfs.ext4 -F rootfs.img
          mkdir -p rootfs
          sudo mount rootfs.img rootfs
          sudo mkdir -p rootfs/usr/bin
          sudo cp /usr/bin/qemu-aarch64-static rootfs/usr/bin/

          echo "=== debootstrap bookworm arm64 ==="
          sudo debootstrap --foreign --arch arm64 \
            --variant=minbase \
            bookworm ./rootfs ${{ env.MIRROR }}
          sudo chroot rootfs /debootstrap/debootstrap --second-stage

          echo "=== install kernel + initramfs ==="
          sudo cp out/*.deb rootfs/tmp/
          sudo chroot rootfs /bin/bash -c '
            set -e
            apt-get update
            apt-get install -y initramfs-tools
            dpkg -i /tmp/linux-image-*.deb
            update-initramfs -c -k $(ls /boot/vmlinuz-* | sed "s|.*vmlinuz-||")
          '
          # copy kernel files out before umount (for bootfs)
          sudo cp rootfs/boot/vmlinuz-* out/ 2>/dev/null || true
          sudo cp rootfs/boot/initrd.img-* out/ 2>/dev/null || true

          echo "=== configure rootfs ==="
          sudo chroot rootfs /bin/bash -c '
            set -e
            echo "c7ltechn" > /etc/hostname
            echo "root:root" | chpasswd
            echo "nameserver 8.8.8.8" > /etc/resolv.conf
            apt-get update
            apt-get install -y --no-install-recommends \
              systemd-sysv init openssh-server \
              wpasupplicant network-manager \
              linux-firmware firmware-linux-free
            systemctl enable ssh
            apt-get clean
          '

          sudo umount rootfs
          img2simg rootfs.img out/rootfs-simg.img
          ls -lh out/rootfs-simg.img

      - name: Build bootfs (extlinux)
        run: |
          set -e
          KVER=$(ls out/vmlinuz-* | sed 's|.*/vmlinuz-||' | head -1)
          echo "KVER=$KVER"
          ROOT_UUID="${{ inputs.rootfs_uuid }}"
          if [ -z "$ROOT_UUID" ]; then
            ROOT_UUID="REPLACE_WITH_YOUR_ROOTFS_UUID"
          fi
          echo "rootfs UUID=$ROOT_UUID"

          dd if=/dev/zero of=bootfs.img bs=1M count=256
          mkfs.ext2 bootfs.img
          mkdir -p bmnt
          sudo mount bootfs.img bmnt
          sudo cp out/vmlinuz-$KVER bmnt/
          sudo cp out/initrd.img-$KVER bmnt/
          sudo mkdir -p bmnt/qcom
          sudo cp out/msm8953-samsung-c7lte.dtb bmnt/qcom/msm8953-samsung-c7lte-mainline.dtb

          sudo mkdir -p bmnt/extlinux
          sudo tee bmnt/extlinux/extlinux.conf > /dev/null << EOF
          timeout 1
          default Debian
          menu title boot prev kernel

          label Debian
          	kernel /vmlinuz-$KVER
          	fdtdir /
          	initrd /initrd.img-$KVER
          	append console=tty0 root=UUID=$ROOT_UUID rw loglevel=3 splash
          EOF
          sudo umount bmnt
          img2simg bootfs.img out/bootfs-simg.img
          ls -lh out/bootfs-simg.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c7-debian-full
          path: |
            out/bootfs-simg.img
            out/rootfs-simg.img
            out/msm8953-samsung-c7lte.dtb
            out/linux-image-*.deb
          retention-days: 30
