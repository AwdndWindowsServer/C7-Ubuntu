name: Build C7 mainline Ubuntu (system + boot) one-shot

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'msm8953-mainline kernel branch'
        required: false
        default: '6.16.3/main'
        type: string
      distro:
        description: 'Ubuntu codename'
        required: false
        default: 'resolute'
        type: string
      rootfs_size_gb:
        description: 'rootfs.img size in GB'
        required: false
        default: '6'
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get remove -y mkbootimg 2>/dev/null || true
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu device-tree-compiler \
            bison flex libssl-dev libdw-dev libelf-dev dpkg-dev \
            build-essential debhelper \
            fakeroot bc kmod cpio \
            debootstrap qemu-user-static binfmt-support \
            android-sdk-libsparse-utils squashfs-tools \
            zstd xz-utils rsync
          sudo apt-get install -y python3 python3-mako
          # 注册 arm64 binfmt，chroot 时才能执行 aarch64 二进制
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true
          sudo systemctl restart binfmt-support 2>/dev/null || true
          # mkbootimg 用仓库自带脚本（避免 apt 新版依赖 gki 模块）
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python3
          sudo cp tools/mkbootimg.py /usr/local/bin/mkbootimg
          sudo chmod +x /usr/local/bin/mkbootimg

      - name: Clone msm8953-mainline kernel
        run: |
          git clone --depth 1 -b "${{ inputs.kernel_branch }}" \
            https://github.com/msm8953-mainline/linux.git linux

      - name: Copy C7 device tree + kernel config
        run: |
          cp device-dts/qcom/msm8953.dtsi linux/arch/arm64/boot/dts/qcom/
          cp device-dts/qcom/pm8953.dtsi linux/arch/arm64/boot/dts/qcom/
          cp device-dts/qcom/msm8953-samsung-c7lte.dts linux/arch/arm64/boot/dts/qcom/
          if ! grep -q "msm8953-samsung-c7lte" linux/arch/arm64/boot/dts/qcom/Makefile; then
            sed -i '/msm8953-motorola-potter.dtb/a\dtb-$(CONFIG_ARCH_QCOM)\t+= msm8953-samsung-c7lte.dtb' \
              linux/arch/arm64/boot/dts/qcom/Makefile
          fi
          sed 's/CONFIG_LOCALVERSION=".*"/CONFIG_LOCALVERSION="-c7-mainline"/' \
            config/msm8953-mainline.config > linux/.config
          cd linux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel (Image + dtb + modules)
        run: |
          cd linux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            qcom/msm8953-samsung-c7lte.dtb
          mkdir -p ../out
          cp arch/arm64/boot/Image ../out/
          cp arch/arm64/boot/dts/qcom/msm8953-samsung-c7lte.dtb ../out/
          # 编译并收集内核模块，安装到 rootfs 用（绕开交叉 deb 构建）
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) modules
          rm -rf ../out/modules-install
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH=../out/modules-install modules_install
          ls -la ../out/modules-install/lib/modules/

      - name: Extract C7 vendor firmware
        run: |
          mkdir -p firmware-c7
          # 仓库不携带固件时跳过（firmware 由 rootfs 里 firmware 包或用户自行补充）
          if [ -d vendor/extract/c7ltechn/system/vendor/firmware ]; then
            cp -a vendor/extract/c7ltechn/system/vendor/firmware/* firmware-c7/ 2>/dev/null || true
          fi
          find firmware-c7 -type f | head -20 || true
      - name: Create rootfs.img and debootstrap Ubuntu
        run: |
          set -e
          ROOTFS_GB=${{ inputs.rootfs_size_gb }}
          dd if=/dev/zero of=rootfs.img bs=1G count=$ROOTFS_GB
          mkfs.ext4 rootfs.img
          mkdir -p mp
          sudo mount rootfs.img mp
          # chroot 执行 arm64 二进制需要 qemu 静态模拟器
          sudo mkdir -p mp/usr/bin
          sudo cp /usr/bin/qemu-aarch64-static mp/usr/bin/
          echo "debootstrap: ubuntu ${{ inputs.distro }} arm64 (tuna)"
          sudo debootstrap --foreign --arch arm64 \
            --components=main,restricted,universe,multiverse \
            --variant=minbase \
            ${{ inputs.distro }} ./mp \
            https://mirrors.tuna.tsinghua.edu.cn/ubuntu/
          # 第二阶段：在 chroot 内用 qemu 完成配置
          sudo chroot mp /debootstrap/debootstrap --second-stage
          sudo umount mp

      - name: Configure rootfs in chroot
        run: |
          sudo bash -c '
            set -e
            mkdir -p mp
            mount rootfs.img mp
            # 保留 qemu 供 chroot 使用
            cp /usr/bin/qemu-aarch64-static mp/usr/bin/
            mount --bind /proc mp/proc
            mount --bind /dev mp/dev
            mount --bind /dev/pts mp/dev/pts
            mount --bind /sys mp/sys
            if [ -n "$(ls -A firmware-c7 2>/dev/null)" ]; then
              cp -r firmware-c7/* mp/lib/firmware/ 2>/dev/null || true
            fi
            shopt -s nullglob
            # 直接安装内核 Image + dtb + modules（绕开 deb 构建）
            KVER=$(ls out/modules-install/lib/modules/ 2>/dev/null | head -1)
            if [ -z "$KVER" ]; then
              echo "ERROR: no kernel modules installed" >&2
              exit 1
            fi
            echo "kernel version: $KVER"
            cp -r out/modules-install/lib/modules/* mp/lib/modules/
            cp out/Image mp/boot/vmlinuz-$KVER
            cp out/msm8953-samsung-c7lte.dtb mp/boot/dtb-$KVER
            cp scripts/configure-chroot.sh mp/configure-chroot.sh
            KVER="$KVER" DISTRO="$1" chroot mp /bin/bash /configure-chroot.sh
            cp mp/boot/initrd.img-* out/ 2>/dev/null || true
            umount mp/sys mp/dev/pts mp/dev mp/proc mp
          ' _ "${{ inputs.distro }}"

      - name: Package boot.img
        run: |
          set -e
          KIMG=out/Image
          DTB=out/msm8953-samsung-c7lte.dtb
          INITRD=$(ls out/initrd.img-* 2>/dev/null | head -1)
          if [ -z "$INITRD" ] || [ ! -s "$INITRD" ]; then
            echo "ERROR: no valid initrd.img found (chroot update-initramfs failed)" >&2
            exit 1
          fi
          RAMDISK="$INITRD"
          # 用 rootfs.img 的真实 UUID 作为启动参数
          ROOT_UUID=$(/sbin/blkid -o value -s UUID rootfs.img)
          echo "rootfs UUID: $ROOT_UUID"
          cat "$KIMG" "$DTB" > out/kernel-dtb
          mkbootimg \
            --base 0x80000000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --pagesize 2048 \
            --second_offset 0x00f00000 \
            --ramdisk "$RAMDISK" \
            --cmdline "console=tty0 root=UUID=$ROOT_UUID rw loglevel=3 splash" \
            --kernel out/kernel-dtb -o out/boot.img
          img2simg rootfs.img out/rootfs-simg.img
          ls -lh out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c7-ubuntu-${{ inputs.distro }}
          path: |
            out/boot.img
            out/rootfs-simg.img
            out/msm8953-samsung-c7lte.dtb
            out/Image
