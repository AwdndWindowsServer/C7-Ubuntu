name: Build Ubuntu 26.04 for SM-C7000 (Full)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: false
        default: 'ubuntu-26.04-c7ltechn-v1.0'

env:
  KERNEL_REPO: https://github.com/msm8953-mainline/linux
  KERNEL_BRANCH: msm8953-6.12
  LK2ND_REPO: https://github.com/msm8953-mainline/lk2nd

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # ============================================================
    # 1. 安装依赖
    # ============================================================
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          debootstrap qemu-user-static binfmt-support \
          bison flex gcc-aarch64-linux-gnu pkg-config \
          libncurses-dev libssl-dev unzip git \
          android-sdk-libsparse-utils \
          wget file dosfstools e2fsprogs \
          make python3 bc cpio rsync kmod \
          device-tree-compiler python3-pyelftools

    # ============================================================
    # 2. 编译 lk2nd（二级引导，提供 Fastboot）
    # ============================================================
    - name: Build lk2nd
      run: |
        git clone --depth 1 $LK2ND_REPO -b ${{ env.LK2ND_BRANCH }}
        cd lk2nd
        # 针对 SM-C7000 修改设备树（如果有专用 dts 则替换）
        # 这里使用 msm8953 通用配置
        make TOOLCHAIN_PREFIX=aarch64-linux-gnu- \
             TARGET=msm8953 \
             EMMC_BOOT=1 \
             SIGNING_ENABLE=0 \
             VERIFIED_BOOT=0 \
             lk2nd.img -j$(nproc)
        cp lk2nd.img ../

    # ============================================================
    # 3. 编译主线内核
    # ============================================================
    - name: Build Kernel
      run: |
        git clone --depth 1 $KERNEL_REPO -b ${{ env.KERNEL_BRANCH }}
        cd linux
        # 使用 msm8953 通用配置，后续可替换为 c7ltechn 专用 defconfig
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
             msm8953_defconfig
        # 启用必要选项（Ubuntu 兼容）
        scripts/config -e CONFIG_DEVTMPFS \
                       -e CONFIG_DEVTMPFS_MOUNT \
                       -e CONFIG_NAMESPACES \
                       -e CONFIG_CGROUPS \
                       -e CONFIG_OVERLAY_FS \
                       -e CONFIG_SQUASHFS \
                       -e CONFIG_DRM_PANEL_SAMSUNG_S6E3FA3 \
                       -e CONFIG_TOUCHSCREEN_MELFAS_MMS449
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
             -j$(nproc) Image.gz dtbs modules
        # 复制产物
        cp arch/arm64/boot/Image.gz ../
        cp arch/arm64/boot/dts/qcom/msm8953-samsung-c7lte*.dtb ../dtb 2>/dev/null || \
        cp arch/arm64/boot/dts/qcom/msm8953*.dtb ../

    # ============================================================
    # 4. 构建 Ubuntu 26.04 RootFS
    # ============================================================
    - name: Build Ubuntu RootFS
      run: |
        # 创建 4GB 镜像
        dd if=/dev/zero of=rootfs.img bs=1G count=4
        mkfs.ext4 -F rootfs.img
        mkdir -p ./rootfs
        sudo mount rootfs.img ./rootfs

        # debootstrap 第一阶段
        sudo debootstrap --arch arm64 \
          --foreign \
          --include=systemd,udev,netplan.io,openssh-server,ca-certificates,gnupg \
          resolute ./rootfs \
          https://mirrors.tuna.tsinghua.edu.cn/ubuntu/

        # 复制 QEMU 并执行第二阶段
        sudo cp /usr/bin/qemu-aarch64-static ./rootfs/usr/bin/
        sudo chroot ./rootfs /bin/bash -c "
          /debootstrap/debootstrap --second-stage
          echo 'nameserver 8.8.8.8' > /etc/resolv.conf
          echo 'nameserver 1.1.1.1' >> /etc/resolv.conf
          echo 'ubuntu-c7ltechn' > /etc/hostname
          echo 'root:ubuntu' | chpasswd
          apt update
          apt install -y linux-firmware wpasupplicant network-manager
        "

        # 配置网络
        sudo tee ./rootfs/etc/netplan/01-netcfg.yaml > /dev/null << 'EOF'
        network:
          version: 2
          ethernets:
            wlan0:
              dhcp4: true
              optional: true
        EOF

        # 安装内核模块到 rootfs
        sudo cp -r ./linux/modules/lib/modules ./rootfs/lib/

        # 卸载
        sudo umount ./rootfs

    # ============================================================
    # 5. 打包刷机文件（boot.img 格式）
    # ============================================================
    - name: Create Boot Image (boot.img)
      run: |
        # 创建 boot 分区镜像（内核 + dtb + initrd 暂空）
        mkdir -p boot_ramdisk
        cd boot_ramdisk
        echo "initrd placeholder" > initrd
        find . | cpio -o -H newc | gzip > ../initrd.img

        # 使用 mkbootimg 打包（Android 格式）
        mkbootimg \
          --kernel ../Image.gz \
          --ramdisk ../initrd.img \
          --dtb ../dtb \
          --base 0x80000000 \
          --pagesize 2048 \
          --kernel_offset 0x8000 \
          --ramdisk_offset 0x01000000 \
          --tags_offset 0x00000100 \
          -o ../boot.img

    # ============================================================
    # 6. 打包最终产物
    # ============================================================
    - name: Package Release
      run: |
        gzip -c rootfs.img > ubuntu-rootfs.img.gz
        gzip -c boot.img > boot.img.gz
        gzip -c lk2nd.img > lk2nd.img.gz

        cat > README.txt << 'EOF'
        ======================================================
        Ubuntu 26.04 for Samsung Galaxy C7 (SM-C7000)
        ======================================================

        刷机方法（需先刷入 lk2nd）：
        1. 通过 Odin/Heimdall 刷入 lk2nd.tar.md5 到 AP/BL 插槽
        2. 重启进入 lk2nd (音量下)
        3. fastboot flash system ubuntu-rootfs.img.gz (需解压)
        4. fastboot flash boot boot.img

        默认密码：root / ubuntu

        GitHub: https://github.com/你的用户名/你的仓库
        ======================================================
        EOF

        # 生成 md5 文件供 Odin
        md5sum -b lk2nd.img > lk2nd.img.md5
        cat lk2nd.img.md5 >> lk2nd.img
        mv lk2nd.img lk2nd.img.tar
        mv lk2nd.img.tar lk2nd.tar.md5

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ubuntu-c7ltechn-full
        path: |
          ubuntu-rootfs.img.gz
          boot.img.gz
          lk2nd.tar.md5
          lk2nd.img.gz
          README.txt
        retention-days: 30

    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.release_tag }}
        name: ${{ github.event.inputs.release_tag }}
        draft: false
        prerelease: true
        files: |
          ubuntu-rootfs.img.gz
          boot.img.gz
          lk2nd.tar.md5
          lk2nd.img.gz
          README.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
